name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [8.0.242, 8.0.252, 8.0.262, 8.0.265, 8.0.272, 8.0.275, 8.0.282, 8.0.292, 8.0.302, 8.0.312, 8.0.322, 8.0.332, 11.0.2, 11.0.3, 11.0.4, 11.0.5, 11.0.6, 11.0.7, 11.0.8, 11.0.9, 11.0.10, 11.0.11, 11.0.12, 11.0.13, 11.0.14]

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK12
      uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java }}
        distribution: 'adopt'
        cache: 'maven'
    - name: Build with Maven
      run: mvn -B package
